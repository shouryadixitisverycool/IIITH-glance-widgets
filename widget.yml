- type: custom-api
  title: Today's Mess
  cache: 15m
  url: ${IIITH_MESS_PROXY_URL}/api/mess/menus
  subrequests:
    registrations:
      url: ${IIITH_MESS_PROXY_URL}/api/registration
    timings:
      url: ${IIITH_MESS_PROXY_URL}/api/config/meal-timings
  options:
    timingMess: yuktahar
    collapseAfter: 6
  template: |
    <style>
      .registrations-iiith-mess {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.6rem 1rem;
      }

      .capacity-iiith-mess {
        width: 100%;
        height: 6px;
        accent-color: var(--color-primary);
      }
    </style>

    {{ $regs := (.Subrequest "registrations").JSON }}
    {{ $day := "sunday" }}
    {{ if eq now.Weekday.String "Monday" }}{{ $day = "monday" }}
    {{ else if eq now.Weekday.String "Tuesday" }}{{ $day = "tuesday" }}
    {{ else if eq now.Weekday.String "Wednesday" }}{{ $day = "wednesday" }}
    {{ else if eq now.Weekday.String "Thursday" }}{{ $day = "thursday" }}
    {{ else if eq now.Weekday.String "Friday" }}{{ $day = "friday" }}
    {{ else if eq now.Weekday.String "Saturday" }}{{ $day = "saturday" }}{{ end }}

    {{ $breakfast := $regs.String "data.breakfast.meal_mess" }}
    {{ $lunch := $regs.String "data.lunch.meal_mess" }}
    {{ $snacks := $regs.String "data.snacks.meal_mess" }}
    {{ $dinner := $regs.String "data.dinner.meal_mess" }}
    <div class="registrations-iiith-mess size-h6 margin-bottom-10">
      <div><div class="color-subdue">BREAKFAST</div><div>{{ if $breakfast }}{{ $breakfast }}{{ else }}-{{ end }}</div></div>
      <div><div class="color-subdue">LUNCH</div><div>{{ if $lunch }}{{ $lunch }}{{ else }}-{{ end }}</div></div>
      <div><div class="color-subdue">SNACKS</div><div>{{ if $snacks }}{{ $snacks }}{{ else }}-{{ end }}</div></div>
      <div><div class="color-subdue">DINNER</div><div>{{ if $dinner }}{{ $dinner }}{{ else }}-{{ end }}</div></div>
    </div>

    {{ $clock := now.Format "15:04:05" }}
    {{ $meal := "" }}
    {{ $state := "" }}
    {{ $timingMess := .Options.StringOr "timingMess" "yuktahar" }}
    {{ range (.Subrequest "timings").JSON.Array (concat "data." $timingMess) }}
      {{ if and (ge $clock (.String "start_time")) (lt $clock (.String "end_time")) }}
        {{ $meal = .String "meal" }}
        {{ $state = "ongoing" }}
      {{ else if and (eq $meal "") (lt $clock (.String "start_time")) }}
        {{ $meal = .String "meal" }}
        {{ $state = "next" }}
      {{ end }}
    {{ end }}

    <div class="margin-top-10">
      {{ if eq $meal "" }}
        <div class="color-subdue">No more meals today.</div>
      {{ else }}
        {{ $mess := $regs.String (concat "data." $meal ".meal_mess") }}
        {{ $cancelled := $regs.String (concat "data." $meal ".cancelled_at") }}
        <div class="color-highlight" style="text-transform: capitalize;">{{ $meal }}{{ if ne $mess "" }} - {{ $mess }}{{ end }}</div>

        {{ if and (eq $state "ongoing") (ne $mess "") }}
          {{
            $capacities := newRequest (concat "${IIITH_MESS_PROXY_URL}" "/api/mess/capacities")
              | withParameter "meal" $meal
              | getResponse
          }}
          {{ range $capacities.JSON.Array "data.registered" }}
            {{ if eq (.String "mess") $mess }}
              <progress class="capacity-iiith-mess" value="{{ .Int "available" }}" max="{{ .Int "capacity" }}" title="{{ .Int "available" }}/{{ .Int "capacity" }} spots available" aria-label="{{ .Int "available" }} of {{ .Int "capacity" }} spots available"></progress>
            {{ end }}
          {{ end }}
        {{ end }}

        {{ if ne $cancelled "" }}
          <div class="color-negative">Registration cancelled</div>
        {{ else if eq $mess "" }}
          <div class="color-subdue">Not registered for this meal.</div>
        {{ else }}
          {{ range .JSON.Array "data" }}
            {{ if eq (.String "mess") $mess }}
              <ul class="list collapsible-container margin-top-5" data-collapse-after="{{ $.Options.IntOr "collapseAfter" 6 }}">
                {{ range .Array (concat "days." $day "." $meal) }}
                  {{ $item := .String "item" }}
                  {{ if and (ne $item "") (ne $item "NA") }}<li>{{ $item }}</li>{{ end }}
                {{ end }}
              </ul>
            {{ end }}
          {{ end }}
        {{ end }}
      {{ end }}
    </div>
