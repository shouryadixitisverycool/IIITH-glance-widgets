name: iiith-glance-widgets

services:
  vpn:
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file: vpn.env
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: openvpn
      OPENVPN_CUSTOM_CONFIG: /gluetun/custom.conf
      FIREWALL_INPUT_PORTS: 8081
      DNS_UPSTREAM_RESOLVER_TYPE: plain
      DNS_UPSTREAM_PLAIN_ADDRESSES: 10.4.20.21:53
      DNS_REBINDING_PROTECTION_EXEMPT_HOSTNAMES: mess.iiit.ac.in,courier.iiit.ac.in,courses.iiit.ac.in
      HEALTH_TARGET_ADDRESSES: mess.iiit.ac.in:443
      HEALTH_ICMP_TARGET_IPS: 10.4.20.21
      BLOCK_MALICIOUS: "off"
    volumes:
      - ./iiith.ovpn:/gluetun/custom.conf:ro
    networks:
      glance:
        aliases:
          - iiith-widgets

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
    env_file: proxy.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  ical-api:
    image: ghcr.io/awildleon/glance-ical-events:v1.3.3
    restart: unless-stopped
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy

networks:
  glance:
    external: true
    name: ${GLANCE_NETWORK:-glance_default}
